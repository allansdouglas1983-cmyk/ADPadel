name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core packages — build, test, typecheck
    runs-on: ubuntu-latest
    env:
      # Fixed seed so fast-check property-test failures reproduce deterministically.
      FASTCHECK_SEED: '424242'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the `packageManager` field in package.json — do not
        # also pin it here or action-setup errors with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (core packages only — the RN app builds via EAS off-CI)
        run: pnpm install --frozen-lockfile --filter "./packages/*..."

      - name: Typecheck core packages
        run: pnpm --filter "./packages/*" typecheck

      - name: Build core packages
        run: pnpm --filter "./packages/*" build

      - name: Test scoring engine
        run: pnpm --filter "@padel/scoring-engine" test

      - name: Test ratings
        run: pnpm --filter "@padel/ratings" test

      - name: Test shared
        run: pnpm --filter "@padel/shared" test

      - name: Test formats
        run: pnpm --filter "@padel/formats" test

      - name: Test stats
        run: pnpm --filter "@padel/stats" test

      - name: Test design tokens
        run: pnpm --filter "@padel/design-tokens" test
