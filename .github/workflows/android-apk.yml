name: Android APK (sideload)

# Builds a production-variant, sideloadable APK for on-device testing — no EAS
# cloud required. The release build embeds the minified production JS bundle
# (not a dev client), so it behaves like a store build. Download it from the
# run's "Artifacts" section and install it on a device with "unknown sources"
# enabled.
#
# Signing:
#   * With NO secrets configured, the APK is signed with the auto-generated
#     Android debug key — installable immediately, but the signature differs
#     between runs (you must uninstall before installing a newer build).
#   * Add an ANDROID_KEYSTORE_BASE64 secret (a keystore using the standard debug
#     alias/passwords: alias `androiddebugkey`, store & key password `android`)
#     for a STABLE signature so each build installs over the previous one:
#       keytool -genkeypair -v -keystore marque.keystore -alias androiddebugkey \
#         -storepass android -keypass android -keyalg RSA -keysize 2048 \
#         -validity 10000 -dname "CN=Marque, O=Marque, L=London, C=GB"
#       base64 -w0 marque.keystore   # paste as the ANDROID_KEYSTORE_BASE64 secret

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional version name to stamp (e.g. 0.1.0-rc1). Defaults to app.config version.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      # Optional public runtime config — read by app.config.ts `extra` and
      # embedded at bundle time. Safe to be absent (the app runs fully offline).
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_RC_ANDROID: ${{ secrets.EXPO_PUBLIC_RC_ANDROID }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
      # Optional — enables Sentry source-map upload; the plugin skips it if unset.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Skip the release source-map upload task (it otherwise fails the build
      # when no Sentry org/project/auth is configured). Runtime crash reporting
      # still works; only symbolication upload is skipped for sideload builds.
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'
      # Each build gets a higher versionCode so it installs over the last one.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # Mapped here so it can be checked in `if:` conditions (secrets can't be
      # referenced directly in step-level `if`).
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the `packageManager` field in package.json — do not
        # also pin it here or action-setup errors with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # The app resolves @padel/* to each package's dist/, so they must be built
      # before Metro bundles the release JS.
      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      - name: Stamp version name (optional)
        if: ${{ github.event.inputs.version_name != '' }}
        run: echo "APP_VERSION_NAME=${{ github.event.inputs.version_name }}" >> "$GITHUB_ENV"

      - name: Prebuild native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Install signing keystore (optional, stable signature)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: apps/mobile
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/debug.keystore
          echo "Using provided keystore for a stable release signature."

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        working-directory: apps/mobile
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "path=apps/mobile/$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marque-release-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
